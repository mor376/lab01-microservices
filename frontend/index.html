<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservices Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        button { padding: 8px 15px; cursor: pointer; }
        input { padding: 8px; }
        li { margin: 8px 0; }
        li button { margin-left: 10px; padding: 3px 10px; }
        .msg { margin-top: 8px; color: #555; }
    </style>
</head>
<body>
    <h2>Danh sách sản phẩm</h2>
    <button onclick="loadProducts()">Tải danh sách sản phẩm</button>
    <input type="text" id="searchName" placeholder="Tìm theo tên">
    <button onclick="searchProducts()">Tìm theo tên</button>
    <ul id="productList"></ul>

    <h2>Thêm sản phẩm</h2>
    <input type="text" id="newName" placeholder="Tên sản phẩm">
    <input type="number" id="newPrice" placeholder="Giá" min="0">
    <button onclick="addProduct()">Thêm sản phẩm</button>
    <div id="addMsg" class="msg"></div>

    <h2>Tìm sản phẩm thông qua Order Service</h2>
    <input type="number" id="productId" placeholder="Nhập ID sản phẩm" min="1">
    <button onclick="findProduct()">Tìm sản phẩm</button>
    <pre id="result"></pre>

    <script>
        const PRODUCT_API = "http://localhost:8081/api/products";

        function renderProducts(products) {
            const list = document.getElementById("productList");
            list.innerHTML = "";
            if (products.length === 0) {
                list.textContent = "Chưa có sản phẩm";
                return;
            }
            products.forEach(product => {
                const li = document.createElement("li");
                li.textContent = `${product.id} - ${product.name} - ${product.price}`;

                const btn = document.createElement("button");
                btn.textContent = "Xóa";
                btn.onclick = () => deleteProduct(product.id);
                li.appendChild(btn);

                list.appendChild(li);
            });
        }

        async function fetchAndRender(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error("Không thể tải danh sách sản phẩm");
                }
                renderProducts(await response.json());
            } catch (error) {
                document.getElementById("productList")
                    .textContent = "Lỗi: " + error.message;
            }
        }

        function loadProducts() {
            fetchAndRender(PRODUCT_API);
        }

        function searchProducts() {
            const name = document.getElementById("searchName").value.trim();
            fetchAndRender(PRODUCT_API + "?name=" + encodeURIComponent(name));
        }

        async function addProduct() {
            const name = document.getElementById("newName").value.trim();
            const priceText = document.getElementById("newPrice").value;
            const msg = document.getElementById("addMsg");

            if (!name || priceText === "" || Number(priceText) < 0) {
                msg.textContent = "Vui lòng nhập tên và giá hợp lệ";
                return;
            }
            try {
                const response = await fetch(PRODUCT_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, price: Number(priceText) })
                });
                if (!response.ok) {
                    throw new Error("Không thể thêm sản phẩm");
                }
                msg.textContent = "Đã thêm sản phẩm";
                document.getElementById("newName").value = "";
                document.getElementById("newPrice").value = "";
                loadProducts();
            } catch (error) {
                msg.textContent = "Lỗi: " + error.message;
            }
        }

        async function deleteProduct(id) {
            if (!confirm("Xóa sản phẩm " + id + "?")) return;
            try {
                const response = await fetch(`${PRODUCT_API}/${id}`, { method: "DELETE" });
                if (response.status === 404) {
                    alert("Sản phẩm không tồn tại");
                } else if (!response.ok) {
                    throw new Error("Không thể xóa sản phẩm");
                }
                loadProducts();
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        }

        async function findProduct() {
            const id = document.getElementById("productId").value;
            const result = document.getElementById("result");
            if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
                result.textContent = "Vui lòng nhập ID hợp lệ";
                return;
            }
            try {
                const response = await fetch(`http://localhost:8082/api/orders/product/${id}`);
                if (response.status === 404) {
                    result.textContent = "Không tìm thấy sản phẩm";
                    return;
                }
                if (!response.ok) {
                    throw new Error("Không thể lấy thông tin sản phẩm");
                }
                const product = await response.json();
                result.textContent = JSON.stringify(product, null, 2);
            } catch (error) {
                result.textContent = "Lỗi: " + error.message;
            }
        }
    </script>
</body>
</html>
